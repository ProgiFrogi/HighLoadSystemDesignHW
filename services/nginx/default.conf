upstream catalog_upstream {
    server catalog-service:8081;
    keepalive 32;
}

upstream order_upstream {
    server order-service:8082;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=order_limit:1m rate=20r/s;
limit_req_zone $http_x_request_id zone=global_limit:1m rate=100r/s;

server {
    listen 80;
    
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
    
    location /api/v1/restaurants {
        proxy_pass http://catalog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_cache my_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 10s;
        proxy_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status;
    }
    

    location /api/v1/orders {
        limit_req zone=order_limit burst=15 nodelay;
        limit_req_status 429;
        
        proxy_pass http://order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
    
    location /api/v1/orders/ {
        limit_except GET {
            deny all;
        }
        
        proxy_pass http://order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=50m inactive=60s use_temp_path=off;